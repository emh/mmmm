<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C3927">
<title>Mighty Miss Molly Mae</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%90%95%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- Shown until every asset is in. Wordless, like the rest of the game: a
     bar that fills, on the colour the forest opens onto. -->
<div id="loading"><div id="loading-bar"></div></div>

<main id="app" hidden>

  <!-- World view: the overwhelming majority of the viewport (§15).
       Staged as a trail corridor seen from behind her (§15A). -->
  <div id="scene" tabindex="0">
    <div id="backdrop"></div>
    <!-- Atmosphere sits directly on the backdrop. It must come BEFORE the
         scenery and the dog, or it paints over the entire world. -->
    <div id="scene-shade"></div>
    <!-- Atmospheric haze at the tree line. Must come before the ground so the
         scenery still paints over it; see the stylesheet for why it exists. -->
    <div id="horizon"></div>
    <div id="ground-wrap"><div id="ground"></div><canvas id="path"></canvas><div id="ground-fade"></div></div>
    <div id="corridor"></div>
    <div id="shadow"></div>
    <div id="dog" role="img" aria-label="Molly Mae"></div>

    <!-- Gesture feedback: a mark where you touched, never a word. -->
    <div id="gesture-ink"></div>
  </div>

  <!-- Development only: the dog inspector (§37) and a reset that forgets her.
       Neither belongs in the shipped game; ?dev=1 or the `d` key shows them. -->
  <div id="corner" hidden>
    <button id="toggle-debug" title="Dog inspector (d)">⚙</button>
    <button id="reset" title="Forget her and start over">⟲</button>
  </div>

</main>

<aside id="inspector" aria-label="Dog inspector"></aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
