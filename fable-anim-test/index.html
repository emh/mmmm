<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Molly Dash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b9530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="An 8-bit endless runner. Steer Molly down a winding trail.">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #101a0c;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage {
    position: fixed; inset: 0;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #screen {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    opacity: 0;
    transition: opacity .35s ease;
  }
  body.ready #screen { opacity: 1; }

  /* Controls sit above the safe area so thumbs and notches stay clear. */
  #controls {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; gap: 10px;
    pointer-events: none;
  }
  #controls button {
    pointer-events: auto;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    font: 600 18px/1 ui-monospace, Menlo, monospace;
    color: #f4ffe6;
    background: rgba(18, 32, 12, .55);
    border: 2px solid rgba(244, 255, 230, .35);
    border-radius: 10px;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: .5;
  }
  #controls button:active { opacity: 1; transform: translateY(1px); }
  #controls button[hidden] { display: none; }
  @media (hover: hover) { #controls button:hover { opacity: .9; } }

  noscript {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #dfeed0; font-size: 14px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen"></canvas></div>
  <div id="controls">
    <button id="btn-sound" type="button" aria-label="Toggle sound">&#9834;</button>
    <button id="btn-pause" type="button" aria-label="Pause">&#9654;</button>
    <button id="btn-quit" type="button" aria-label="End run" hidden>&#9632;</button>
  </div>
  <noscript>Molly Dash needs JavaScript.</noscript>

  <script src="js/pix.js"></script>
  <script src="js/font.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world.js"></script>
  <script src="js/dog.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
